services:
  api:
    build: .
    container_name: sharethat-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app.app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: .
    container_name: sharethat-frontend
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: streamlit run frontend.py --server.port=8501 --server.address=0.0.0.0
