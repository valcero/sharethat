[project]
name = "sharethat"
version = "1.0.0"
description = "A full-stack, asynchronous media sharing platform with real-time CDN processing, JWT authentication, and interactive social feed."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.21.0",
    "fastapi>=0.118.0",
    "fastapi-users[sqlalchemy]>=14.0.1",
    "httpx>=0.27.0",
    "imagekitio>=4.2.0,<5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.1.1",
    "streamlit>=1.50.0",
    "uvicorn[standard]>=0.37.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

